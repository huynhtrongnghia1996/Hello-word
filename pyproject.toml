[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "efms-etms-automation"
version = "1.0.0"
description = "Python automation framework for eFMS/eTMS UI, API, DB and pytest-html reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "playwright>=1.52.0",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-html>=4.1.1",
    "pytest-metadata>=3.1.1",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest-rerunfailures>=15.1",
    "pytest-xdist>=3.7.0",
    "pyright>=1.1.401",
    "ruff>=0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: smoke tests",
    "login: login tests",
    "efms: eFMS tests",
    "etms: eTMS tests",
    "api: API tests",
    "db: database tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "basic"
